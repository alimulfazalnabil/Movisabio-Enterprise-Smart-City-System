[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "movisabio-enterprise"
version = "3.1.0"
description = "MoviSabio Enterprise Smart City Platform & AI Traffic Control System (AITCS)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary Restricted" }
authors = [
    { name = "MoviSabio Enterprise Engineering Team" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "asyncpg>=0.29.0",
    "redis>=5.0.1",
    "torch>=2.2.0",
    "numpy>=1.26.4",
    "opencv-python-headless>=4.9.0.80",
    "PyYAML>=6.0",
    "httpx>=0.27.0",
    "opentelemetry-api>=1.23.0",
    "opentelemetry-sdk>=1.23.0",
    "prometheus-client>=0.20.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "locust>=2.24.0",
    "flake8>=7.0.0",
    "black>=24.2.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
