services:
  db:
    image: postgis/postgis:15-3.3
    container_name: movisabio_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-movisabio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-movisabio}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-movisabio} -d ${POSTGRES_DB:-movisabio}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: movisabio_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: movisabio_api
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-movisabio}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-movisabio}
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
      CONTROLLER_MODE: MOCK

  dashboard:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: movisabio_dashboard
    depends_on:
      - api
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    environment:
      AITCS_API_URL: http://api:8000

volumes:
  pgdata:
