version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: movisabio_db
    environment:
      POSTGRES_USER: movisabio
      POSTGRES_PASSWORD: movisabiosecret
      POSTGRES_DB: movisabio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movisabio"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: movisabio_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
