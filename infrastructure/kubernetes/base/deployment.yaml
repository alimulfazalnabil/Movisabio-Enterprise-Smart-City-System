apiVersion: apps/v1
kind: Deployment
metadata:
  name: movisabio-api
  labels:
    app: movisabio
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: movisabio
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: movisabio
        tier: backend
    spec:
      containers:
      - name: movisabio-api
        image: movisabio/api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: movisabio-config
        - secretRef:
            name: movisabio-secrets
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
